<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARXI Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
:root {
  --bg: #eceef1; --surface: #ffffff; --line: #d9dde3; --fg: #161a20; --muted: #5d6673;
  --accent: #b86a12; --wall: #2a2e35; --wall-2: #1d2026;
  --display: "Silkscreen", "IBM Plex Mono", monospace; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1013; --surface: #161a1f; --line: #2a3039; --fg: #e6e9ed; --muted: #8d96a3; --accent: #f2a640; --wall: #0a0b0d; --wall-2: #050607; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0e1013; --surface: #161a1f; --line: #2a3039; --fg: #e6e9ed; --muted: #8d96a3; --accent: #f2a640; --wall: #0a0b0d; --wall-2: #050607; color-scheme: dark }
* { box-sizing: border-box }
html, body { min-height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); display: grid; place-items: center; min-height: 100vh;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)) }
main { width: 100%; max-width: 920px }
.hero { background: radial-gradient(120% 120% at 50% 0%, var(--wall), var(--wall-2)); border-radius: 18px; padding: 44px 28px 40px; text-align: center; color: #e8ebef }
.mark { display: inline-flex; align-items: center; gap: 12px; font: 40px/1 var(--display); letter-spacing: .04em }
.mark .eelmark { width: 54px; height: 27px }
.tag { margin: 10px 0 0; font: italic 13px var(--body); color: #9aa3ae }
.lead { margin: 18px auto 0; max-width: 46ch; color: #c9ced6 }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px }
@media (max-width: 720px) { .cards { grid-template-columns: 1fr } .mark { font-size: 32px } }
.card { display: flex; flex-direction: column; gap: 10px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); text-decoration: none; transition: border-color .15s, transform .15s }
.card:hover { border-color: var(--accent); transform: translateY(-2px) }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.cic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: var(--bg); color: var(--accent) }
.card h2 { margin: 0; font-size: 19px; font-weight: 600 }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1 }
.go { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent) }
.card:hover .go svg { transform: translateX(3px) } .go svg { transition: transform .15s }
footer { margin-top: 14px; text-align: center; font: 12px var(--mono); color: var(--muted) }
@media (prefers-reduced-motion: reduce) { .card, .go svg { transition: none } .card:hover { transform: none } }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="mark"><span id="eel"></span>ARXI</div>
    <p class="tag">light from current</p>
    <p class="lead">See the Bar and Panel on the wall before they're built. Pick who it's for.</p>
  </section>

  <nav class="cards" aria-label="Sections">
    <a class="card" href="home/">
      <span class="cic" data-ic="home"></span>
      <h2>Home</h2>
      <p>Living room, bedroom, den and backyard.</p>
      <span class="go">Open <span data-ic="arrowright"></span></span>
    </a>
    <a class="card" href="commercial/">
      <span class="cic" data-ic="store"></span>
      <h2>Commercial</h2>
      <p>Bars, cafes, shops and funeral homes.</p>
      <span class="go">Open <span data-ic="arrowright"></span></span>
    </a>
    <a class="card" href="government/">
      <span class="cic" data-ic="bus"></span>
      <h2>Government</h2>
      <p>Transit stops and park kiosks.</p>
      <span class="go">Open <span data-ic="arrowright"></span></span>
    </a>
  </nav>

  <footer>ARXI Simulator · ARXIv2 firmware</footer>
</main>

<script src="shared/icons.js"></script>
<script>
  document.getElementById('eel').innerHTML = eelMark();
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = icon(e.dataset.ic, e.classList.contains('cic') ? 22 : 14));
</script>
</body>
</html>
